    <!--
      Tema antes del primer pintado.
      Si esto viviera en el bundle de Vue, la página se pintaría con el tema por
      defecto y luego saltaría al elegido: un destello visible en cada carga.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var prefersDark =
            !window.matchMedia ||
            window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = saved || (prefersDark ? 'dark' : 'light')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Inter:wght@300..700&display=swap"
